name: Release

# Push a tag like v1.0.0 to build the apps and publish them on the Releases page.
# Pushing the branch "build-test" (or "Run workflow") builds them without publishing.
on:
  push:
    tags: ["v*"]
    branches: ["build-test"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    # ARM builds must never block the other downloads
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
            experimental: true
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-arm64
            experimental: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          packaging/ci-run.sh sh -c '
            python -m pip install --upgrade pip &&
            { python -m pip install ".[all]" pyinstaller ||
              { [ "${{ matrix.experimental }}" = "true" ] && echo "falling back to fewer extras" &&
                { python -m pip install ".[serial,windows]" pyinstaller || python -m pip install . pyinstaller; }; }; }'
          echo "VER=$(python -c 'import zebraapp; print(zebraapp.__version__)')" >> "$GITHUB_ENV"

      - name: Which optional parts are in this build
        run: |
          python - <<'PY'
          import importlib
          have, miss = [], []
          for m in ("bleak", "serial", "pyzipper", "PIL", "win32print"):
              try:
                  importlib.import_module(m); have.append(m)
              except Exception:
                  miss.append(m)
          print("::notice title=${{ matrix.target }} optional parts::included: %s; missing: %s" % (", ".join(have) or "-", ", ".join(miss) or "-"))
          PY

      - name: Tests
        run: packaging/ci-run.sh python packaging/run-tests.py

      - name: Build and package (packaging/build.py, same as `make package`)
        run: packaging/ci-run.sh python packaging/build.py package --system-python

      - name: Smoke test (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN=dist/ZebraApp.app/Contents/MacOS/ZebraApp; else BIN=dist/zebraapp/zebraapp; fi
          "$BIN" --no-browser --port 8799 --data-dir "$RUNNER_TEMP/zd" &
          PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/ping && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/ > page.html && grep -q ZebraApp page.html
          curl -sf -o /dev/null http://127.0.0.1:8799/api/fonts
          kill $PID

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ZebraApp.exe -ArgumentList "--no-browser","--port","8799","--data-dir","$env:RUNNER_TEMP\zd" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8799/api/ping | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Write-Host "::error title=smoke test::ZebraApp.exe did not start"; exit 1 }
          $page = (Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing).Content
          if ($page -notmatch "ZebraApp") { Write-Host "::error title=smoke test::page is wrong"; exit 1 }
          Invoke-RestMethod http://127.0.0.1:8799/api/fonts | Out-Null
          Stop-Process -Id $p.Id

      - name: Check the AppImage starts (Linux)
        if: runner.os == 'Linux'
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/release/*.AppImage --version

      - name: Install the .deb through a signed apt repository and start it (Linux)
        if: runner.os == 'Linux'
        run: |
          packaging/ci-run.sh sh -c 'sudo apt-get update && sudo apt-get install -y apt-utils && sudo sh -x packaging/check-apt.sh dist/release'

      - uses: actions/upload-artifact@v4
        with:
          name: ZebraApp-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  android:
    name: build (android)
    # not signed -> test only; a missing Android SDK must never block the desktop downloads
    continue-on-error: true
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Tests (web part)
        run: node tests/js/test_zpl.js
      - name: Build the APK (android/build-apk.sh, same as `make apk`)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/zebraapp.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/zebraapp.jks"
          else
            echo "::notice title=android::No ANDROID_KEYSTORE_B64 secret: building a debug-signed test APK that will not be published."
          fi
          packaging/ci-run.sh android/build-apk.sh
      - name: Check the APK
        run: |
          APK=$(ls dist/release/*.apk)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt dump badging "$APK" | sed -n '1p;/uses-permission/p' | head -20
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist/release/*-android.apk') != '' }}
        with:
          name: ZebraApp-android
          path: dist/release/*-android.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist/release/*-android-debug.apk') != '' }}
        with:
          name: test-android-debug
          path: dist/release/*-android-debug.apk
          if-no-files-found: error

  publish:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: ZebraApp-*
          merge-multiple: true
      - name: Release notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## " v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          cat packaging/RELEASE-DOWNLOAD.md >> notes.md
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: notes.md
