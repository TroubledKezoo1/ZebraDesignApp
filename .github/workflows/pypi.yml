name: PyPI

# Publishes the Python package to PyPI when a tag like v1.0.1 is pushed.
# Switched on by the repository variable PUBLISH_PYPI=true (Settings > Variables) once the
# "trusted publisher" is set up on pypi.org, see docs/DISTRIBUTION.md. No password or token needed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine ".[nlbl]"
      - run: python packaging/run-tests.py
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish:
    needs: build
    if: vars.PUBLISH_PYPI == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
